[project]
name = "factory"
version = "0.1.0"
description = "Kanıt-tabanlı gate + domain denetleyicisi — software factory kontrol katmanı (Multica üstünde ince katman)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
factory = "factory.cli:main"
factory-mcp = "factory.mcp:main"
factory-lead = "factory.lead:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
